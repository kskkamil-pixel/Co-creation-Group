<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b4a">
  <title>Teaching Method Picker</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e302a;background:#f5faf6;--green:#176b4a;--dark:#104c36;--muted:#52675e}
    *{box-sizing:border-box}body{margin:0;padding:28px 16px 48px}main{max-width:900px;margin:auto}.panel{padding:clamp(20px,4vw,36px);margin-bottom:18px;border:1px solid #cfe2d7;border-radius:18px;background:#fff;box-shadow:0 12px 32px #1b453115}h1,h2{color:var(--dark)}h1{margin:0 0 10px;font-size:clamp(1.8rem,5vw,2.6rem)}h2{font-size:1.2rem}.intro p,.hint{color:var(--muted);line-height:1.6}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}.choice{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid #e1eee6;border-radius:12px;background:#f5faf6;cursor:pointer;line-height:1.5}.choice:hover{border-color:#9fc9ad;background:#f0f8f2}.choice input{width:18px;height:18px;flex:none;margin:3px 0 0;accent-color:var(--green)}.choice strong,.choice small{display:block}.choice small{margin-top:5px;color:var(--muted);font-size:.9rem}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}button{min-height:46px;padding:11px 18px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--green);color:white}.secondary{border:1px solid #c9ded0;background:#edf5ef;color:var(--dark)}button:hover{filter:brightness(1.04)}dialog{width:min(92vw,650px);max-height:85vh;padding:24px;border:1px solid #cfe2d7;border-radius:16px;color:inherit}dialog::backdrop{background:#10241dcc}#review-list{padding-left:22px;line-height:1.6}#review-list li{margin:12px 0}#review-list small{display:block;color:var(--muted)}@media(max-width:540px){body{padding:16px 11px}.actions button{width:100%}}
  </style>
</head>
<body>
  <main>
    <header class="panel intro">
      <p class="hint">STEAM · GreenComp · Co-creation</p>
      <h1>Choose teaching methods</h1>
      <p>Select all methods used in your lesson. You can review your choices before downloading them.</p>
    </header>
    <section class="panel" aria-labelledby="methods-heading">
      <h2 id="methods-heading">Teaching methods</h2>
      <div class="choices" id="method-options"></div>
      <div class="actions">
        <button class="primary" id="download-methods" type="button">Download selections</button>
        <button class="secondary" id="review-methods" type="button">Review selections</button>
        <button class="secondary" id="clear-methods" type="button">Clear choices</button>
      </div>
    </section>
  </main>
  <dialog id="review-dialog" aria-labelledby="review-heading">
    <h2 id="review-heading">Review your teaching methods</h2>
    <p class="hint" id="review-empty" hidden>No teaching methods selected yet.</p>
    <ul id="review-list"></ul>
    <div class="actions"><button class="primary" id="close-review" type="button">Done</button></div>
  </dialog>
  <script>
    const methods = [
      ["Value creation pedagogy", "Learners apply their competences to create something of value for at least one stakeholder outside their own group, class or school."],
      ["Learner-led learning", "Learners actively contribute their experience to make learning relevant, purposeful and meaningful to their own needs and interests."],
      ["Project-based learning", "Learners develop knowledge and skills through projects based on real-world challenges and problems that matter to them."],
      ["Service learning", "Learners turn ideas into action to meet real-world needs in their local community."],
      ["Laboratory learning", "Learners learn through hands-on experience gained from trial-and-error experimentation with objects, materials and phenomena."],
      ["Seriously playful learning", "Learners take a creative, explorative and immersive attitude to learning that stimulates intrinsic motivation and flow."],
      ["Cooperative learning", "Learners learn with and from each other, considering diverse perspectives, needs and learning preferences."]
    ];
    const options = document.getElementById("method-options");
    methods.forEach(([title, description]) => {
      const label = document.createElement("label");
      label.className = "choice";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.name = "teachingMethod";
      checkbox.value = title;
      const text = document.createElement("span");
      const heading = document.createElement("strong");
      heading.textContent = title;
      const detail = document.createElement("small");
      detail.textContent = description;
      text.append(heading, detail);
      label.append(checkbox, text);
      options.append(label);
    });
    const selectedMethods = () => [...document.querySelectorAll('input[name="teachingMethod"]:checked')].map(input => input.value);
    const reviewDialog = document.getElementById("review-dialog");
    document.getElementById("review-methods").addEventListener("click", () => {
      const selected = selectedMethods();
      const list = document.getElementById("review-list");
      list.replaceChildren();
      document.getElementById("review-empty").hidden = selected.length > 0;
      selected.forEach(title => {
        const item = methods.find(([name]) => name === title);
        const li = document.createElement("li");
        const heading = document.createElement("strong");
        heading.textContent = item[0];
        const detail = document.createElement("small");
        detail.textContent = item[1];
        li.append(heading, detail);
        list.append(li);
      });
      reviewDialog.showModal();
    });
    document.getElementById("close-review").addEventListener("click", () => reviewDialog.close());
    document.getElementById("clear-methods").addEventListener("click", () => {
      document.querySelectorAll('input[name="teachingMethod"]').forEach(input => { input.checked = false; });
    });
    document.getElementById("download-methods").addEventListener("click", () => {
      const selected = selectedMethods();
      if (!selected.length) {
        alert("Please choose at least one teaching method before downloading.");
        return;
      }
      const lines = ["Selected teaching methods", "", ...selected.flatMap(title => {
        const [name, description] = methods.find(([methodName]) => methodName === title);
        return [`${name}\n${description}`, ""];
      })];
      const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "teaching-methods.txt";
      link.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
